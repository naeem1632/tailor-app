<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Expense Details')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid" style="padding-top: 24px; max-width: 900px;">

    <div class="page-header-standard">
        <h1><i class="fas fa-receipt"></i> Expense #<span th:text="${expense.id}"></span></h1>
        <div class="header-actions">
            <a th:href="@{/daily-expenses}" class="btn-secondary-custom">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
    </div>

    <!-- Expense Details Card -->
    <div style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border-radius: 6px; padding: 24px; margin-bottom: 24px; color: white;">
        <div class="row">
            <div class="col-md-6">
                <div style="opacity: 0.9; font-size: 12px; margin-bottom: 4px;">Expense Date & Time</div>
                <div style="font-size: 20px; font-weight: 700;">
                    <span th:text="${#temporals.format(expense.expenseDate, 'dd MMM yyyy')}"></span> -
                    <span th:text="${expense.expenseTime != null ? #temporals.format(expense.expenseTime, 'hh:mm a') : '-'}"></span>
                </div>
            </div>
            <div class="col-md-6">
                <div style="opacity: 0.9; font-size: 12px; margin-bottom: 4px;">Amount</div>
                <div style="font-size: 32px; font-weight: 700;">
                    Rs. <span th:text="${#numbers.formatInteger(expense.amount, 0, 'COMMA')}"></span>
                </div>
            </div>
        </div>

        <div class="row" style="margin-top: 20px;">
            <div class="col-md-6">
                <div style="opacity: 0.9; font-size: 12px; margin-bottom: 4px;">Category</div>
                <div style="font-size: 18px; font-weight: 600;">
                    <span th:if="${expense.category == 'UTILITIES'}">
                        <i class="fas fa-lightbulb"></i> UTILITIES
                    </span>
                    <span th:if="${expense.category == 'RENT'}">
                        <i class="fas fa-home"></i> RENT
                    </span>
                    <span th:if="${expense.category == 'MATERIALS'}">
                        <i class="fas fa-box"></i> MATERIALS
                    </span>
                    <span th:if="${expense.category == 'SALARIES'}">
                        <i class="fas fa-money-bill-wave"></i> SALARIES
                    </span>
                    <span th:if="${expense.category == 'MAINTENANCE'}">
                        <i class="fas fa-tools"></i> MAINTENANCE
                    </span>
                    <span th:if="${expense.category == 'MISCELLANEOUS'}">
                        <i class="fas fa-list"></i> MISCELLANEOUS
                    </span>
                    <span th:if="${expense.category == 'OTHER'}">
                        <i class="fas fa-question"></i> <span th:text="${expense.customCategory}"></span>
                    </span>
                </div>
            </div>
            <div class="col-md-6">
                <div style="opacity: 0.9; font-size: 12px; margin-bottom: 4px;">Payment Method</div>
                <div style="font-size: 18px; font-weight: 600;">
                    <span th:if="${expense.paymentMethod == 'CASH'}">
                        <i class="fas fa-money-bill"></i> CASH
                    </span>
                    <span th:if="${expense.paymentMethod == 'BANK_TRANSFER'}">
                        <i class="fas fa-university"></i> BANK TRANSFER
                    </span>
                    <span th:if="${expense.paymentMethod == 'JAZZCASH'}">
                        <i class="fas fa-mobile-alt"></i> JAZZCASH
                    </span>
                    <span th:if="${expense.paymentMethod == 'EASYPAISA'}">
                        <i class="fas fa-mobile-alt"></i> EASYPAISA
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- Details -->
    <div style="background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 24px; margin-bottom: 20px;">
        <div class="row" th:if="${expense.description}">
            <div class="col-md-12">
                <label style="font-weight: 600; color: #666; margin-bottom: 8px;">Description:</label>
                <div style="font-size: 16px; color: #333;" th:text="${expense.description}"></div>
            </div>
        </div>

        <div class="row" th:if="${expense.notes}" style="margin-top: 16px;">
            <div class="col-md-12">
                <label style="font-weight: 600; color: #666; margin-bottom: 8px;">Notes:</label>
                <div style="font-size: 14px; color: #666; white-space: pre-line;" th:text="${expense.notes}"></div>
            </div>
        </div>

        <div th:if="${!expense.description && !expense.notes}" style="text-align: center; padding: 20px; color: #999;">
            <i>No additional details provided</i>
        </div>
    </div>

    <!-- Actions -->
    <div style="text-align: right;">
        <form th:action="@{/daily-expenses/delete/{id}(id=${expense.id})}" method="post" id="deleteExpenseForm">
            <button type="button" class="btn-danger-custom" id="deleteExpenseBtn">
                <i class="fas fa-trash"></i> Delete Expense
            </button>
        </form>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="confirmDeleteModal" class="modal-overlay">
        <div class="modal-box">
            <h3>⚠ Confirm Deletion</h3>
            <p>Are you sure you want to delete this expense of Rs. <span th:text="${#numbers.formatInteger(expense.amount, 0, 'COMMA')}"></span>?</p>
            <div class="modal-actions">
                <button id="confirmDeleteBtn" class="btn-danger-custom">Yes, Delete</button>
                <button id="cancelDeleteBtn" class="btn-secondary-custom">Cancel</button>
            </div>
        </div>
    </div>

</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
    // Delete confirmation modal handling
    document.getElementById('deleteExpenseBtn').addEventListener('click', function(e) {
        e.preventDefault();
        document.getElementById('confirmDeleteModal').style.display = 'flex';
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
        document.getElementById('deleteExpenseForm').submit();
    });

    document.getElementById('cancelDeleteBtn').addEventListener('click', function() {
        document.getElementById('confirmDeleteModal').style.display = 'none';
    });

    // Close modal on overlay click
    document.getElementById('confirmDeleteModal').addEventListener('click', function(e) {
        if (e.target === this) {
            this.style.display = 'none';
        }
    });
</script>
</body>
</html>
