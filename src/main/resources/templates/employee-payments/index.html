<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Payments - Stitch &amp; Style</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/fontawesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/fonts.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid" style="padding-top: 24px;">

    <div class="page-header-standard">
        <h1><i class="fas fa-money-check-alt"></i> Employee Payment Records</h1>
        <div class="header-actions">
            <a th:href="@{/employee-payments/payroll}" class="btn-success-custom">
                <i class="fas fa-calculator"></i> Payroll Calculator
            </a>
        </div>
    </div>

    <!-- Filter Section -->
    <div class="card-info">
        <form method="get" th:action="@{/employee-payments}">
            <div class="row align-items-end">
                <div class="col-md-4">
                    <label style="display: block; margin-bottom: 4px; font-weight: 600;">Employee</label>
                    <select name="employeeId" class="form-control">
                        <option value="">All Employees</option>
                        <option th:each="emp : ${employees}" th:value="${emp.id}"
                                th:text="${emp.name}"
                                th:selected="${selectedEmployee != null && emp.id == selectedEmployee.id}">
                        </option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label style="display: block; margin-bottom: 4px; font-weight: 600;">Payment Status</label>
                    <select name="status" class="form-control">
                        <option value="">All Statuses</option>
                        <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">Pending</option>
                        <option value="PARTIALLY_PAID" th:selected="${selectedStatus == 'PARTIALLY_PAID'}">Partially Paid</option>
                        <option value="PAID" th:selected="${selectedStatus == 'PAID'}">Paid</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn-primary-custom">Filter</button>
                    <a th:href="@{/employee-payments}" class="btn-secondary-custom" style="margin-left: 8px;">Clear</a>
                </div>
            </div>
        </form>
    </div>

    <!-- Messages -->
    <div th:if="${success}" class="alert alert-success" role="alert">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <!-- Payments Table -->
    <table class="table">
        <thead>
        <tr>
            <th>Record #</th>
            <th>Created</th>
            <th>Employee</th>
            <th>Work Period</th>
            <th>Work Items</th>
            <th>Total Amount</th>
            <th>Amount Paid</th>
            <th>Remaining</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(payments)}">
            <td colspan="10" style="text-align: center; padding: 40px; color: #999;">
                <i class="fas fa-inbox" style="font-size: 48px; margin-bottom: 12px; opacity: 0.3;"></i>
                <div>No payment records found.</div>
            </td>
        </tr>
        <tr th:each="payment : ${payments}">
            <td>
                <strong style="color: #007bff;">#<span th:text="${payment.id}"></span></strong>
            </td>
            <td th:text="${payment.createdAt != null ? #temporals.format(payment.createdAt, 'dd MMM yyyy') : '-'}"></td>
            <td th:text="${payment.employee.name}"></td>
            <td>
                <span th:text="${#temporals.format(payment.workPeriodStart, 'dd MMM')}"></span> -
                <span th:text="${#temporals.format(payment.workPeriodEnd, 'dd MMM yyyy')}"></span>
            </td>
            <td>
                <div style="font-size: 12px; font-weight: 600;">
                    <span th:text="${#lists.size(payment.workAssignments)}"></span> items
                </div>
                <div style="font-size: 11px; color: #666; margin-top: 4px; line-height: 1.6;">
                    <div th:each="assignment : ${payment.workAssignments}">
                        <span th:if="${assignment.workType == 'CUTTING'}">
                            <span style="color: #007bff;">Cut</span>
                        </span>
                        <span th:if="${assignment.workType == 'STITCHING' && !assignment.isDesignWork}">
                            <span style="color: #28a745;">Stitch</span>
                        </span>
                        <span th:if="${assignment.workType == 'STITCHING' && assignment.isDesignWork}">
                            <span style="color: #dc3545; font-weight: 600;">Design</span>
                        </span>
                        <span th:if="${assignment.workType == 'FINISHING'}">
                            <span style="color: #6f42c1;">Finish</span>
                        </span>
                        <span th:if="${assignment.workType == 'EMBELLISHMENT'}">
                            <span style="color: #fd7e14;">Embel</span>
                        </span>
                        <span th:text="${assignment.itemType}"></span>
                        (<span th:text="${assignment.assignedCount}"></span>)
                    </div>
                </div>
            </td>
            <td style="font-weight: 700;">
                Rs. <span th:text="${#numbers.formatInteger(payment.totalAmount, 0, 'COMMA')}"></span>
            </td>
            <td style="font-weight: 600; color: #28a745;">
                Rs. <span th:text="${#numbers.formatInteger(payment.amountPaid, 0, 'COMMA')}"></span>
            </td>
            <td style="font-weight: 600; color: #dc3545;">
                Rs. <span th:text="${#numbers.formatInteger(payment.amountRemaining, 0, 'COMMA')}"></span>
            </td>
            <td>
                <span th:if="${payment.paymentStatus == 'PENDING'}"
                      style="background: #fff3cd; color: #856404; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600;">
                    <i class="fas fa-clock"></i> PENDING
                </span>
                <span th:if="${payment.paymentStatus == 'PARTIALLY_PAID'}"
                      style="background: #cfe2ff; color: #084298; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600;">
                    <i class="fas fa-hourglass-half"></i> PARTIALLY PAID
                </span>
                <span th:if="${payment.paymentStatus == 'PAID'}"
                      style="background: #d4edda; color: #155724; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600;">
                    <i class="fas fa-check-circle"></i> PAID
                </span>
            </td>
            <td>
                <a th:href="@{/employee-payments/view/{id}(id=${payment.id})}" class="btn btn-sm btn-info" title="View Details">
                    <i class="fas fa-eye"></i> View
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
