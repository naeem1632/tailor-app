<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit User - Stitch &amp; Style</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/fontawesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/fonts.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid" style="padding-top: 24px;">

    <div class="page-header-standard">
        <h1><i class="fas fa-user-edit"></i> Edit User</h1>
        <div class="header-actions">
            <a th:href="@{/users}" class="btn-secondary-custom">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
    </div>

    <!-- Messages -->
    <div th:if="${success}" class="alert alert-success" role="alert">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <div style="max-width: 800px;">
        <!-- User Info Form -->
        <div class="card-standard">
            <h5 style="margin-bottom: 16px; border-bottom: 2px solid #17a2b8; padding-bottom: 8px;">
                <i class="fas fa-user-edit"></i> User Information
            </h5>
            <form th:action="@{/users/edit/{id}(id=${user.id})}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" style="font-weight: 600;">
                            <i class="fas fa-user"></i> Full Name
                        </label>
                        <input type="text" name="fullName" class="form-control"
                               th:value="${user.fullName}" required/>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" style="font-weight: 600;">
                            <i class="fas fa-user-circle"></i> Username
                        </label>
                        <input type="text" class="form-control"
                               th:value="${user.username}" disabled/>
                        <small class="text-muted">Username cannot be changed</small>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" style="font-weight: 600;">
                            <i class="fas fa-envelope"></i> Email
                        </label>
                        <input type="email" name="email" class="form-control"
                               th:value="${user.email}" required/>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" style="font-weight: 600;">
                            <i class="fas fa-shield-alt"></i> Role
                        </label>
                        <select name="role" class="form-control">
                            <option value="USER" th:selected="${user.role == 'USER'}">User</option>
                            <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">Admin</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-success-custom">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a th:href="@{/users}" class="btn-secondary-custom" style="margin-left: 8px;">
                    <i class="fas fa-arrow-left"></i> Back to Users
                </a>
            </form>
        </div>

        <!-- Change Password Form -->
        <div class="card-standard">
            <h5 style="margin-bottom: 16px; border-bottom: 2px solid #ffc107; padding-bottom: 8px;">
                <i class="fas fa-key"></i> Change Password
            </h5>
            <form th:action="@{/users/change-password/{id}(id=${user.id})}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" style="font-weight: 600;">
                            <i class="fas fa-lock"></i> New Password
                        </label>
                        <input type="password" name="newPassword" class="form-control"
                               placeholder="Enter new password (min 6 characters)" minlength="6"/>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" style="font-weight: 600;">
                            <i class="fas fa-lock"></i> Confirm Password
                        </label>
                        <input type="password" name="confirmPassword" class="form-control"
                               placeholder="Re-enter new password" minlength="6"/>
                    </div>
                </div>

                <button type="submit" class="btn-warning-custom">
                    <i class="fas fa-key"></i> Change Password
                </button>
            </form>
        </div>

        <!-- User Status Info -->
        <div class="card-standard">
            <h5 style="margin-bottom: 16px; border-bottom: 2px solid #28a745; padding-bottom: 8px;">
                <i class="fas fa-info-circle"></i> User Status
            </h5>
            <div class="row">
                <div class="col-md-4">
                    <div style="padding: 12px; background: #f8f9fa; border-radius: 4px; margin-bottom: 12px;">
                        <strong>Account Status:</strong>
                        <span th:if="${user.enabled}" style="color: #28a745;">
                            <i class="fas fa-check-circle"></i> Enabled
                        </span>
                        <span th:if="${!user.enabled}" style="color: #dc3545;">
                            <i class="fas fa-ban"></i> Disabled
                        </span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div style="padding: 12px; background: #f8f9fa; border-radius: 4px; margin-bottom: 12px;">
                        <strong>Lock Status:</strong>
                        <span th:if="${user.accountNonLocked}" style="color: #28a745;">
                            <i class="fas fa-unlock"></i> Unlocked
                        </span>
                        <span th:if="${!user.accountNonLocked}" style="color: #dc3545;">
                            <i class="fas fa-lock"></i> Locked
                        </span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div style="padding: 12px; background: #f8f9fa; border-radius: 4px; margin-bottom: 12px;">
                        <strong>Last Login:</strong>
                        <span th:text="${user.lastLogin != null ? #temporals.format(user.lastLogin, 'dd MMM yyyy HH:mm') : 'Never'}"></span>
                    </div>
                </div>
            </div>
            <div style="padding: 12px; background: #f8f9fa; border-radius: 4px;">
                <strong>Created:</strong>
                <span th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'dd MMM yyyy HH:mm') : '-'}"></span>
            </div>
        </div>

    </div>

</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
