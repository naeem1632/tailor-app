<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add User - Stitch &amp; Style</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/fontawesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/fonts.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid" style="padding-top: 24px;">

    <div style="margin-bottom: 20px;">
        <h1><i class="fas fa-user-plus"></i> Add New User</h1>
    </div>

    <!-- Error Message -->
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <!-- Add User Form -->
    <div style="max-width: 600px;">
        <form th:action="@{/users/add}" method="post" th:object="${user}">
            <div class="mb-3">
                <label class="form-label" style="font-weight: 600;">
                    <i class="fas fa-user"></i> Full Name
                </label>
                <input type="text" th:field="*{fullName}" class="form-control"
                       placeholder="Enter full name" required/>
                <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" style="font-weight: 600;">
                    <i class="fas fa-user-circle"></i> Username
                </label>
                <input type="text" th:field="*{username}" class="form-control"
                       placeholder="Choose a username" required minlength="3"/>
                <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" style="font-weight: 600;">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <input type="email" th:field="*{email}" class="form-control"
                       placeholder="your.email@example.com" required/>
                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" style="font-weight: 600;">
                    <i class="fas fa-shield-alt"></i> Role
                </label>
                <select name="role" class="form-control">
                    <option value="USER">User</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label" style="font-weight: 600;">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" th:field="*{password}" class="form-control"
                       placeholder="Enter password (min 6 characters)" required minlength="6"/>
                <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" style="font-weight: 600;">
                    <i class="fas fa-lock"></i> Confirm Password
                </label>
                <input type="password" name="confirmPassword" class="form-control"
                       placeholder="Re-enter password" required minlength="6"/>
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Create User
                </button>
                <a th:href="@{/users}" class="btn btn-secondary" style="margin-left: 8px;">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>

</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
