<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Work Assignments')}"></head>
<style>
    tr.row-highlight {
        background-color: #fff3cd !important;
        animation: highlightPulse 5s ease-in-out forwards;
    }

    tr.row-highlight td {
        background-color: transparent !important;
    }

    @keyframes highlightPulse {
        0% {
            background-color: #fff3cd;
        }
        50% {
            background-color: #ffe082;
        }
        100% {
            background-color: transparent;
        }
    }
</style>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid" style="padding-top: 24px;">

    <!-- Page Header -->
    <div class="page-header-standard">
        <h1><i class="fas fa-tasks"></i> Work Assignments</h1>
        <div class="header-actions">
            <button type="button" class="btn-warning-custom" onclick="showBulkTransferModal()" style="margin-right: 8px;">
                <i class="fas fa-users"></i> Bulk Transfer
            </button>
            <a th:href="@{/work-assignments/wip-summary}" class="btn-info-custom">
                <i class="fas fa-chart-bar"></i> WIP Summary
            </a>
        </div>
    </div>

    <!-- Filter Section -->
    <div class="card-info">
        <form method="get" th:action="@{/work-assignments}">
            <div class="row align-items-end">
                <div class="col-md-3">
                    <label style="display: block; margin-bottom: 4px; font-weight: 600;">Employee</label>
                    <select name="employeeId" class="form-control">
                        <option value="">All Employees</option>
                        <option th:each="emp : ${employees}" th:value="${emp.id}"
                                th:text="${emp.name}"
                                th:selected="${selectedEmployee != null && emp.id == selectedEmployee.id}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label style="display: block; margin-bottom: 4px; font-weight: 600;">Status</label>
                    <select name="status" class="form-control">
                        <option value="">All Statuses</option>
                        <option value="ASSIGNED" th:selected="${selectedStatus == 'ASSIGNED'}">Assigned</option>
                        <option value="IN_PROGRESS" th:selected="${selectedStatus == 'IN_PROGRESS'}">In Progress</option>
                        <option value="COMPLETED" th:selected="${selectedStatus == 'COMPLETED'}">Completed</option>
                        <option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">Cancelled</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label style="display: block; margin-bottom: 4px; font-weight: 600;">Order Date From</label>
                    <input type="date" name="startDate" class="form-control" th:value="${startDate}"/>
                </div>
                <div class="col-md-2">
                    <label style="display: block; margin-bottom: 4px; font-weight: 600;">Order Date To</label>
                    <input type="date" name="endDate" class="form-control" th:value="${endDate}"/>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn-primary-custom">
                        <i class="fas fa-filter"></i> Filter
                    </button>
                    <a th:href="@{/work-assignments}" class="btn-secondary-custom" style="margin-left: 8px;">
                        <i class="fas fa-times"></i> Clear
                    </a>
                </div>
            </div>
        </form>
    </div>

    <!-- Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Assignments Grouped by Order -->
    <div th:if="${#lists.isEmpty(assignments)}" style="text-align: center; padding: 60px; background: #f8f9fa; border-radius: 4px; color: #999;">
        <i class="fas fa-inbox" style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
        <div style="font-size: 18px;">No work assignments found.</div>
    </div>

    <!-- Group assignments by payment/order -->
    <div th:unless="${#lists.isEmpty(assignments)}">
        <!-- We'll use JavaScript to group the assignments -->
        <div id="assignments-container"></div>

        <!-- Hidden data for JavaScript processing -->
        <div id="assignments-data" style="display: none;">
            <div th:each="assignment : ${assignments}" class="assignment-item"
                 th:attr="data-payment-id=${assignment.payment.id},
                          data-payment-date=${#temporals.format(assignment.payment.date, 'yyyy-MM-dd')},
                          data-payment-date-formatted=${#temporals.format(assignment.payment.date, 'dd MMM yyyy')},
                          data-client-name=${assignment.payment.client.name},
                          data-client-id=${assignment.payment.client.id},
                          data-assigned-date=${assignment.assignedDate != null ? #temporals.format(assignment.assignedDate, 'dd MMM yyyy') : '-'},
                          data-assigned-time=${assignment.assignedTime != null ? #temporals.format(assignment.assignedTime, 'hh:mm a') : ''},
                          data-started-date=${assignment.startedDate != null ? #temporals.format(assignment.startedDate, 'dd MMM yyyy') : ''},
                          data-started-time=${assignment.startedTime != null ? #temporals.format(assignment.startedTime, 'hh:mm a') : ''},
                          data-completed-date=${assignment.completedDate != null ? #temporals.format(assignment.completedDate, 'dd MMM yyyy') : ''},
                          data-completed-time=${assignment.completedTime != null ? #temporals.format(assignment.completedTime, 'hh:mm a') : ''},
                          data-employee-id=${assignment.employee.id},
                          data-employee-name=${assignment.employee.name},
                          data-work-type=${assignment.workType},
                          data-item-type=${assignment.itemType},
                          data-is-design=${assignment.isDesignWork},
                          data-quantity=${assignment.assignedCount},
                          data-rate=${assignment.ratePerPiece},
                          data-amount=${assignment.totalAmount},
                          data-status=${assignment.status},
                          data-assignment-id=${assignment.id}">
            </div>
        </div>
    </div>

</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:inline="javascript">
    // Get CSRF token for forms
    const csrfToken = /*[[${_csrf.token}]]*/ '';
    const csrfParamName = /*[[${_csrf.parameterName}]]*/ '';

    // Get all employees for reassignment dropdown
    const allEmployees = [];
    /*[# th:each="emp : ${employees}"]*/
    allEmployees.push({
        id: /*[[${emp.id}]]*/ 0,
        name: /*[[${emp.name}]]*/ ''
    });
    /*[/]*/

    document.addEventListener('DOMContentLoaded', function() {
        const assignmentsData = document.getElementById('assignments-data');
        if (!assignmentsData) return;

        const assignmentItems = assignmentsData.querySelectorAll('.assignment-item');
        if (assignmentItems.length === 0) return;

        // Group assignments by payment ID
        const groupedByPayment = {};

        assignmentItems.forEach(item => {
            const paymentId = item.dataset.paymentId;

            if (!groupedByPayment[paymentId]) {
                groupedByPayment[paymentId] = {
                    paymentId: paymentId,
                    paymentDate: item.dataset.paymentDate,
                    paymentDateFormatted: item.dataset.paymentDateFormatted,
                    clientName: item.dataset.clientName,
                    clientId: item.dataset.clientId,
                    assignments: []
                };
            }

            groupedByPayment[paymentId].assignments.push({
                assignedDate: item.dataset.assignedDate,
                assignedTime: item.dataset.assignedTime,
                startedDate: item.dataset.startedDate,
                startedTime: item.dataset.startedTime,
                completedDate: item.dataset.completedDate,
                completedTime: item.dataset.completedTime,
                employeeId: item.dataset.employeeId,
                employeeName: item.dataset.employeeName,
                workType: item.dataset.workType,
                itemType: item.dataset.itemType,
                isDesign: item.dataset.isDesign === 'true',
                quantity: item.dataset.quantity,
                rate: item.dataset.rate,
                amount: item.dataset.amount,
                status: item.dataset.status,
                assignmentId: item.dataset.assignmentId
            });
        });

        // Convert to array and sort by payment date (newest first)
        const ordersArray = Object.values(groupedByPayment);
        ordersArray.sort((a, b) => new Date(b.paymentDate) - new Date(a.paymentDate));

        // Build the HTML
        const container = document.getElementById('assignments-container');
        let html = '';

        ordersArray.forEach(order => {
            const totalItems = order.assignments.length;

            html += `
                <div style="background: #fff; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 16px; overflow: hidden;">
                    <!-- Order Header -->
                    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 16px; cursor: pointer;"
                         onclick="toggleOrder('order-${order.paymentId}')">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div style="display: flex; gap: 20px; align-items: center; flex: 1;">
                                <div style="background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 4px; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.3);">
                                    <div style="color: rgba(255,255,255,0.9); font-size: 11px; margin-bottom: 2px;">Order</div>
                                    <div style="color: white; font-size: 20px; font-weight: 700;">#${order.paymentId}</div>
                                </div>
                                <div>
                                    <div style="color: rgba(255,255,255,0.8); font-size: 12px; margin-bottom: 2px;">Client</div>
                                    <div style="color: white; font-size: 16px; font-weight: 600;">
                                        ${order.clientName} <span style="opacity: 0.7; font-size: 13px; font-weight: 400;">(${order.clientId})</span>
                                    </div>
                                </div>
                                <div>
                                    <div style="color: rgba(255,255,255,0.8); font-size: 12px; margin-bottom: 2px;">Order Date</div>
                                    <div style="color: white; font-size: 14px; font-weight: 600;">${order.paymentDateFormatted}</div>
                                </div>
                                <div>
                                    <div style="color: rgba(255,255,255,0.8); font-size: 12px; margin-bottom: 2px;">Work Items</div>
                                    <div style="color: white; font-size: 14px; font-weight: 600;">${totalItems} assignment${totalItems !== 1 ? 's' : ''}</div>
                                </div>
                            </div>
                            <div style="color: white; font-size: 20px;">
                                <i class="fas fa-chevron-down" id="icon-order-${order.paymentId}"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Order Content (Assignments Table) -->
                    <div id="order-${order.paymentId}" style="display: none; padding: 20px;">
                        <table class="table table-sm">
                            <thead>
                                <tr style="background: #f8f9fa;">
                                    <th>Assigned Date & Time</th>
                                    <th>Employee</th>
                                    <th>Work Type</th>
                                    <th>Item</th>
                                    <th>Quantity</th>
                                    <th>Rate</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            order.assignments.forEach(assignment => {
                const statusBadge = getStatusBadge(assignment.status);
                const workTypeBadge = getWorkTypeBadge(assignment.workType);
                const actionButtons = getActionButtons(assignment.status, assignment.assignmentId, order.paymentId, assignment.employeeId);

                // Determine which date/time to show based on status
                let displayDate = assignment.assignedDate;
                let displayTime = assignment.assignedTime;
                let dateLabel = 'Assigned';

                if (assignment.status === 'COMPLETED' && assignment.completedDate) {
                    displayDate = assignment.completedDate;
                    displayTime = assignment.completedTime;
                    dateLabel = 'Completed';
                } else if (assignment.status === 'IN_PROGRESS' && assignment.startedDate) {
                    displayDate = assignment.startedDate;
                    displayTime = assignment.startedTime;
                    dateLabel = 'Started';
                }

                html += `
                    <tr data-assignment-id="${assignment.assignmentId}">
                        <td>
                            <div style="font-size: 10px; color: #999; text-transform: uppercase; margin-bottom: 2px;">${dateLabel}</div>
                            <div style="font-size: 13px;">${displayDate}</div>
                            ${displayTime ? `<div style="font-size: 11px; color: #666;">${displayTime}</div>` : ''}
                        </td>
                        <td>${assignment.employeeName}</td>
                        <td>${workTypeBadge}</td>
                        <td>
                            ${assignment.itemType}
                            ${assignment.isDesign ? '<span style="color: #dc3545; font-size: 11px;"> (Design)</span>' : ''}
                        </td>
                        <td>${assignment.quantity}</td>
                        <td>Rs. ${formatNumber(assignment.rate)}</td>
                        <td style="font-weight: 700;">Rs. ${formatNumber(assignment.amount)}</td>
                        <td>${statusBadge}</td>
                        <td>${actionButtons}</td>
                    </tr>
                `;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;

        // Restore the previously expanded order and scroll position after DOM is ready
        setTimeout(function() {
            restoreExpandedOrder();
            restoreScrollPosition();
            highlightUpdatedRow();
        }, 200);
    });

    // Highlight the updated assignment row
    function highlightUpdatedRow() {
        const updatedAssignmentId = localStorage.getItem('updatedAssignmentId');
        if (updatedAssignmentId) {
            console.log('Looking for assignment ID:', updatedAssignmentId);

            // Find the row with the matching assignment ID
            const row = document.querySelector(`tr[data-assignment-id="${updatedAssignmentId}"]`);
            console.log('Found row:', row);

            if (row) {
                console.log('Row classes before:', row.className);

                // Add a highlight class with animation
                row.classList.add('row-highlight');

                console.log('Row classes after:', row.className);
                console.log('Row background color:', window.getComputedStyle(row).backgroundColor);

                // Scroll the row into view if it's inside a collapsed accordion
                row.scrollIntoView({ behavior: 'smooth', block: 'center' });

                // Remove highlight class after 6 seconds (after animation completes)
                setTimeout(() => {
                    console.log('Removing highlight class');
                    row.classList.remove('row-highlight');
                }, 6000);
            } else {
                console.log('Row not found for assignment ID:', updatedAssignmentId);
            }

            localStorage.removeItem('updatedAssignmentId');
        }
    }

    function toggleOrder(orderId) {
        const content = document.getElementById(orderId);
        const icon = document.getElementById('icon-' + orderId);

        if (content.style.display === 'none') {
            content.style.display = 'block';
            icon.className = 'fas fa-chevron-up';
            // Save expanded state
            localStorage.setItem('expandedOrder', orderId);
        } else {
            content.style.display = 'none';
            icon.className = 'fas fa-chevron-down';
            // Clear saved state
            localStorage.removeItem('expandedOrder');
        }
    }

    // Restore expanded order after page load
    function restoreExpandedOrder() {
        const expandedOrder = localStorage.getItem('expandedOrder');
        if (expandedOrder) {
            const content = document.getElementById(expandedOrder);
            const icon = document.getElementById('icon-' + expandedOrder);
            if (content && icon) {
                content.style.display = 'block';
                icon.className = 'fas fa-chevron-up';
            }
        }
    }

    // Restore scroll position
    function restoreScrollPosition() {
        const savedScrollPosition = localStorage.getItem('scrollPosition');
        if (savedScrollPosition) {
            window.scrollTo(0, parseInt(savedScrollPosition));
            localStorage.removeItem('scrollPosition');
        }
    }

    function getStatusBadge(status) {
        const badges = {
            'ASSIGNED': '<span style="background: #fff3cd; color: #856404; padding: 2px 8px; border-radius: 8px; font-size: 11px;">ASSIGNED</span>',
            'IN_PROGRESS': '<span style="background: #cfe2ff; color: #084298; padding: 2px 8px; border-radius: 8px; font-size: 11px;">IN PROGRESS</span>',
            'COMPLETED': '<span style="background: #d4edda; color: #155724; padding: 2px 8px; border-radius: 8px; font-size: 11px;">COMPLETED</span>',
            'CANCELLED': '<span style="background: #f8d7da; color: #721c24; padding: 2px 8px; border-radius: 8px; font-size: 11px;">CANCELLED</span>'
        };
        return badges[status] || status;
    }

    function getWorkTypeBadge(workType) {
        const badges = {
            'CUTTING': '<span style="background: #e3f2fd; color: #1565c0; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;">CUTTING</span>',
            'STITCHING': '<span style="background: #f3e5f5; color: #6a1b9a; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;">STITCHING</span>',
            'FINISHING': '<span style="background: #fff3e0; color: #e65100; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;">FINISHING</span>',
            'EMBELLISHMENT': '<span style="background: #fce4ec; color: #c2185b; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;">EMBELLISHMENT</span>'
        };
        return badges[workType] || workType;
    }

    function getActionButtons(status, assignmentId, paymentId, employeeId) {
        let buttons = '';

        if (status === 'ASSIGNED') {
            // Start Work button
            buttons += `
                <button type="button" class="btn btn-sm btn-primary" title="Start Work"
                        onclick="performAction('start', ${assignmentId}, ${paymentId})">
                    <i class="fas fa-play"></i>
                </button>
            `;
        } else if (status === 'IN_PROGRESS') {
            // Complete button
            buttons += `
                <button type="button" class="btn btn-sm btn-success" title="Complete" style="margin-right: 4px;"
                        onclick="performAction('complete', ${assignmentId}, ${paymentId})">
                    <i class="fas fa-check"></i>
                </button>
            `;
            // Pause button
            buttons += `
                <button type="button" class="btn btn-sm btn-warning" title="Pause Work"
                        onclick="performAction('pause', ${assignmentId}, ${paymentId})">
                    <i class="fas fa-pause"></i>
                </button>
            `;
        }

        // Reassign button for ASSIGNED and IN_PROGRESS statuses (hide for COMPLETED)
        if (status === 'ASSIGNED' || status === 'IN_PROGRESS') {
            buttons += `
                <button type="button" class="btn btn-sm btn-info" title="Reassign" onclick="showReassignModal(${assignmentId}, ${paymentId}, ${employeeId})">
                    <i class="fas fa-exchange-alt"></i>
                </button>
            `;
        }

        // Show completion badge for COMPLETED status
        if (status === 'COMPLETED') {
            buttons += `
                <span style="color: #28a745; font-size: 14px;" title="Work completed">
                    <i class="fas fa-check-circle"></i>
                </span>
            `;
        }

        return buttons;
    }

    function saveExpandedOrder(orderId) {
        localStorage.setItem('expandedOrder', orderId);
        // Save scroll position before form submission
        localStorage.setItem('scrollPosition', window.scrollY);
    }

    // Auto-dismiss alerts after page load
    window.addEventListener('load', function() {
        // Auto-dismiss alerts after 10 seconds
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(function(alert) {
            setTimeout(function() {
                const bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            }, 10000); // 10 seconds
        });
    });

    function formatNumber(num) {
        return parseInt(num).toLocaleString('en-US');
    }

    // Show reassign modal
    function showReassignModal(assignmentId, paymentId, currentEmployeeId) {
        document.getElementById('reassignAssignmentId').value = assignmentId;
        document.getElementById('reassignPaymentId').value = paymentId;

        // Populate employee dropdown excluding current employee
        const employeeSelect = document.getElementById('newEmployeeId');
        employeeSelect.innerHTML = '<option value="">-- Select Employee --</option>';

        allEmployees.forEach(emp => {
            // Skip the current employee
            if (emp.id != currentEmployeeId) {
                const option = document.createElement('option');
                option.value = emp.id;
                option.textContent = emp.name;
                employeeSelect.appendChild(option);
            }
        });

        const modal = new bootstrap.Modal(document.getElementById('reassignModal'));
        modal.show();
    }

    // Show bulk transfer modal
    function showBulkTransferModal() {
        const modal = new bootstrap.Modal(document.getElementById('bulkTransferModal'));
        modal.show();
    }

    // Perform action (start, complete, pause) via AJAX
    function performAction(action, assignmentId, paymentId) {
        // Save state before reload
        localStorage.setItem('expandedOrder', 'order-' + paymentId);
        localStorage.setItem('scrollPosition', window.scrollY);
        localStorage.setItem('updatedAssignmentId', assignmentId);

        fetch(`/work-assignments/${action}/${assignmentId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `${csrfParamName}=${csrfToken}`
        })
        .then(response => {
            // Reload the page to refresh data
            window.location.reload();
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error performing action. Please try again.');
        });
    }
</script>

<!-- Reassign Modal -->
<div class="modal fade" id="reassignModal" tabindex="-1" aria-labelledby="reassignModalLabel" aria-hidden="true" style="z-index: 1055;">
    <div class="modal-dialog" style="z-index: 1056;">
        <div class="modal-content" style="z-index: 1057;">
            <div class="modal-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                <h5 class="modal-title"><i class="fas fa-exchange-alt"></i> Reassign Work</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="reassignForm" onsubmit="submitReassign(event); return false;">
                <input type="hidden" id="reassignAssignmentId"/>
                <input type="hidden" id="reassignPaymentId"/>

                <div class="modal-body">
                    <div class="form-group" style="margin-bottom: 16px;">
                        <label for="newEmployeeId" style="font-weight: 600; margin-bottom: 8px;">Reassign to Employee <span style="color: red;">*</span></label>
                        <select name="newEmployeeId" id="newEmployeeId" class="form-control" required>
                            <option value="">-- Select Employee --</option>
                            <!-- Options populated dynamically by JavaScript -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="reassignReason" style="font-weight: 600; margin-bottom: 8px;">Reason (Optional)</label>
                        <textarea name="reason" id="reassignReason" class="form-control" rows="3"
                                  placeholder="Enter reason for reassignment..."></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-exchange-alt"></i> Reassign
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bulk Transfer Modal -->
<div class="modal fade" id="bulkTransferModal" tabindex="-1" aria-labelledby="bulkTransferModalLabel" aria-hidden="true" style="z-index: 1055;">
    <div class="modal-dialog modal-lg" style="z-index: 1056;">
        <div class="modal-content" style="z-index: 1057;">
            <div class="modal-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                <h5 class="modal-title"><i class="fas fa-users"></i> Bulk Transfer Work</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/work-assignments/bulk-transfer}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="modal-body">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i> Transfer all work assignments from one employee to another. Only unpaid assignments will be transferred.
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group" style="margin-bottom: 16px;">
                                <label for="fromEmployeeId" style="font-weight: 600; margin-bottom: 8px;">From Employee <span style="color: red;">*</span></label>
                                <select name="fromEmployeeId" id="fromEmployeeId" class="form-control" required>
                                    <option value="">-- Select Employee --</option>
                                    <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-group" style="margin-bottom: 16px;">
                                <label for="toEmployeeId" style="font-weight: 600; margin-bottom: 8px;">To Employee <span style="color: red;">*</span></label>
                                <select name="toEmployeeId" id="toEmployeeId" class="form-control" required>
                                    <option value="">-- Select Employee --</option>
                                    <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name}"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 16px;">
                        <label style="font-weight: 600; margin-bottom: 8px;">Include Statuses <span style="color: red;">*</span></label>
                        <div style="display: flex; gap: 16px;">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="statuses" value="ASSIGNED" id="statusAssigned" checked>
                                <label class="form-check-label" for="statusAssigned">Assigned</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="statuses" value="IN_PROGRESS" id="statusInProgress" checked>
                                <label class="form-check-label" for="statusInProgress">In Progress</label>
                            </div>
                        </div>
                        <small style="color: #666;">Select which work statuses to transfer</small>
                    </div>

                    <div class="form-group">
                        <label for="bulkReason" style="font-weight: 600; margin-bottom: 8px;">Reason (Optional)</label>
                        <textarea name="reason" id="bulkReason" class="form-control" rows="3"
                                  placeholder="e.g., Employee on leave, Emergency reassignment..."></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-users"></i> Transfer Work
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Submit reassign form via AJAX
    function submitReassign(event) {
        event.preventDefault();

        const assignmentId = document.getElementById('reassignAssignmentId').value;
        const newEmployeeId = document.getElementById('newEmployeeId').value;
        const reason = document.getElementById('reassignReason').value;
        const paymentId = document.getElementById('reassignPaymentId').value;

        if (!newEmployeeId) {
            alert('Please select an employee');
            return;
        }

        // Save state before reload
        localStorage.setItem('expandedOrder', 'order-' + paymentId);
        localStorage.setItem('scrollPosition', window.scrollY);
        localStorage.setItem('updatedAssignmentId', assignmentId);

        // Submit via AJAX
        const formData = new FormData();
        formData.append(csrfParamName, csrfToken);
        formData.append('newEmployeeId', newEmployeeId);
        formData.append('reason', reason);
        formData.append('paymentId', paymentId);

        fetch(`/work-assignments/reassign/${assignmentId}`, {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (response.ok) {
                // Close modal
                const modal = bootstrap.Modal.getInstance(document.getElementById('reassignModal'));
                modal.hide();

                // Clear form
                document.getElementById('newEmployeeId').value = '';
                document.getElementById('reassignReason').value = '';

                // Reload page to refresh data
                window.location.reload();
            } else {
                alert('Error reassigning work. Please try again.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error reassigning work. Please try again.');
        });
    }
</script>

</body>
</html>
