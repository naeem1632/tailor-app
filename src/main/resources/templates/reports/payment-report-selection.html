<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Payment Report')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <!-- Page Header -->
    <div class="page-header-standard text-center mb-4">
        <h1><i class="fas fa-chart-line"></i> Client Payment Report</h1>
        <p class="text-muted">Select date range to generate report</p>
    </div>

    <!-- Form Card -->
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-standard">
                <div class="card-body">
                    <form th:action="@{/print/report}" method="get">
                        <div class="mb-3">
                            <label class="form-label" for="startDate">
                                <i class="fas fa-calendar-alt"></i> Start Date
                            </label>
                            <input
                                type="date"
                                id="startDate"
                                name="startDate"
                                class="form-control"
                                required>
                            <div class="d-flex gap-2 mt-2 flex-wrap">
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="setThisMonth()">This Month</button>
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="setLastMonth()">Last Month</button>
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="setThisYear()">This Year</button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="endDate">
                                <i class="fas fa-calendar-check"></i> End Date
                            </label>
                            <input
                                type="date"
                                id="endDate"
                                name="endDate"
                                class="form-control"
                                required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary-custom flex-fill">
                                <i class="fas fa-file-invoice"></i> Generate Report
                            </button>
                            <a th:href="@{/}" class="btn btn-secondary-custom flex-fill">
                                <i class="fas fa-arrow-left"></i> Back
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script>
        // Set default dates to current month
        window.onload = function() {
            setThisMonth();
        };

        function setThisMonth() {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);

            document.getElementById('startDate').value = formatDate(firstDay);
            document.getElementById('endDate').value = formatDate(lastDay);
        }

        function setLastMonth() {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth() - 1, 1);
            const lastDay = new Date(today.getFullYear(), today.getMonth(), 0);

            document.getElementById('startDate').value = formatDate(firstDay);
            document.getElementById('endDate').value = formatDate(lastDay);
        }

        function setThisYear() {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), 0, 1);
            const lastDay = new Date(today.getFullYear(), 11, 31);

            document.getElementById('startDate').value = formatDate(firstDay);
            document.getElementById('endDate').value = formatDate(lastDay);
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
    </script>
</body>
</html>
