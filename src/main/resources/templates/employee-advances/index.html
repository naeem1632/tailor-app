<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Advance Payments')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid" style="padding-top: 24px;">

    <div class="page-header-standard">
        <h1><i class="fas fa-hand-holding-usd"></i> Advance Payments</h1>
        <div class="header-actions">
            <a th:href="@{/employee-advances/add}" class="btn-success-custom">
                <i class="fas fa-plus"></i> Give Advance
            </a>
        </div>
    </div>

    <!-- Filter Section -->
    <div class="card-info">
        <form method="get" th:action="@{/employee-advances}">
            <div class="row align-items-end">
                <div class="col-md-5">
                    <label style="display: block; margin-bottom: 4px; font-weight: 600;">Employee</label>
                    <select name="employeeId" class="form-control">
                        <option value="">All Employees</option>
                        <option th:each="emp : ${employees}" th:value="${emp.id}"
                                th:text="${emp.name}"
                                th:selected="${selectedEmployee != null && emp.id == selectedEmployee.id}">
                        </option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label style="display: block; margin-bottom: 4px; font-weight: 600;">Status</label>
                    <select name="status" class="form-control">
                        <option value="">All Statuses</option>
                        <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">Pending (Not Recovered)</option>
                        <option value="PARTIALLY_RECOVERED" th:selected="${selectedStatus == 'PARTIALLY_RECOVERED'}">Partially Recovered</option>
                        <option value="FULLY_RECOVERED" th:selected="${selectedStatus == 'FULLY_RECOVERED'}">Fully Recovered</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn-primary-custom">Filter</button>
                    <a th:href="@{/employee-advances}" class="btn-secondary-custom" style="margin-left: 8px;">Clear</a>
                </div>
            </div>
        </form>
    </div>

    <!-- Messages -->
    <div th:if="${success}" class="alert alert-success" role="alert">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <!-- Advances Table -->
    <table class="table">
        <thead>
        <tr>
            <th>Advance #</th>
            <th>Date</th>
            <th>Employee</th>
            <th>Amount</th>
            <th>Recovered</th>
            <th>Balance</th>
            <th>Status</th>
            <th>Payment Method</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(advances)}">
            <td colspan="9" style="text-align: center; padding: 40px; color: #999;">
                <i class="fas fa-inbox" style="font-size: 48px; margin-bottom: 12px; opacity: 0.3;"></i>
                <div>No advance payments found.</div>
            </td>
        </tr>
        <tr th:each="advance : ${advances}">
            <td>
                <strong style="color: #007bff;">#<span th:text="${advance.id}"></span></strong>
            </td>
            <td>
                <div th:text="${#temporals.format(advance.advanceDate, 'dd MMM yyyy')}"></div>
                <div th:if="${advance.advanceTime != null}" style="font-size: 11px; color: #666;"
                     th:text="${#temporals.format(advance.advanceTime, 'hh:mm a')}"></div>
            </td>
            <td th:text="${advance.employee.name}"></td>
            <td style="font-weight: 700;">
                Rs. <span th:text="${#numbers.formatInteger(advance.amount, 0, 'COMMA')}"></span>
            </td>
            <td style="font-weight: 600; color: #28a745;">
                Rs. <span th:text="${#numbers.formatInteger(advance.amount - advance.balanceRemaining, 0, 'COMMA')}"></span>
            </td>
            <td style="font-weight: 600; color: #dc3545;">
                Rs. <span th:text="${#numbers.formatInteger(advance.balanceRemaining, 0, 'COMMA')}"></span>
            </td>
            <td>
                <span th:if="${advance.status == 'PENDING'}"
                      style="background: #fff3cd; color: #856404; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600;">
                    <i class="fas fa-clock"></i> PENDING
                </span>
                <span th:if="${advance.status == 'PARTIALLY_RECOVERED'}"
                      style="background: #cfe2ff; color: #084298; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600;">
                    <i class="fas fa-hourglass-half"></i> PARTIAL
                </span>
                <span th:if="${advance.status == 'FULLY_RECOVERED'}"
                      style="background: #d4edda; color: #155724; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600;">
                    <i class="fas fa-check-circle"></i> RECOVERED
                </span>
            </td>
            <td>
                <span th:if="${advance.paymentMethod == 'CASH'}" style="font-size: 11px;">
                    <i class="fas fa-money-bill"></i> Cash
                </span>
                <span th:if="${advance.paymentMethod == 'BANK_TRANSFER'}" style="font-size: 11px;">
                    <i class="fas fa-university"></i> Bank
                </span>
                <span th:if="${advance.paymentMethod == 'JAZZCASH'}" style="font-size: 11px;">
                    <i class="fas fa-mobile-alt"></i> JazzCash
                </span>
                <span th:if="${advance.paymentMethod == 'EASYPAISA'}" style="font-size: 11px;">
                    <i class="fas fa-mobile-alt"></i> Easypaisa
                </span>
            </td>
            <td>
                <a th:href="@{/employee-advances/view/{id}(id=${advance.id})}" class="btn btn-sm btn-info" title="View Details">
                    <i class="fas fa-eye"></i> View
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
