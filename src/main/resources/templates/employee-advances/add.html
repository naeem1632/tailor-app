<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Give Advance Payment')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid" style="padding-top: 24px; max-width: 900px;">

    <div class="page-header-standard">
        <h1><i class="fas fa-hand-holding-usd"></i> Give Advance Payment</h1>
        <div class="header-actions">
            <a th:href="@{/employee-advances}" class="btn-secondary-custom">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
    </div>

    <!-- Error Messages -->
    <div th:if="${error}" class="alert alert-danger" role="alert" style="margin-bottom: 20px;">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <div class="card-info">
        <form th:action="@{/employee-advances/add}" th:object="${advancePayment}" method="post">

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label style="font-weight: 600;">Employee <span style="color: red;">*</span></label>
                        <select name="employeeId" class="form-control" required>
                            <option value="">-- Select Employee --</option>
                            <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name}"></option>
                        </select>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label style="font-weight: 600;">Amount <span style="color: red;">*</span></label>
                        <input type="number" th:field="*{amount}" class="form-control" required min="1"
                               placeholder="Enter amount"/>
                        <div class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label style="font-weight: 600;">Advance Date <span style="color: red;">*</span></label>
                        <input type="date" th:field="*{advanceDate}" class="form-control" required/>
                        <div class="error" th:if="${#fields.hasErrors('advanceDate')}" th:errors="*{advanceDate}"></div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label style="font-weight: 600;">Advance Time</label>
                        <input type="time" th:field="*{advanceTime}" class="form-control"/>
                        <div class="error" th:if="${#fields.hasErrors('advanceTime')}" th:errors="*{advanceTime}"></div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label style="font-weight: 600;">Payment Method <span style="color: red;">*</span></label>
                        <select th:field="*{paymentMethod}" class="form-control" required>
                            <option value="">-- Select Method --</option>
                            <option value="CASH">Cash</option>
                            <option value="BANK_TRANSFER">Bank Transfer</option>
                            <option value="JAZZCASH">JazzCash</option>
                            <option value="EASYPAISA">Easypaisa</option>
                        </select>
                        <div class="error" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label style="font-weight: 600;">Reason (Optional)</label>
                        <input type="text" th:field="*{reason}" class="form-control"
                               placeholder="e.g., Emergency, Personal need"/>
                        <div class="error" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></div>
                    </div>
                </div>
            </div>

            <div style="text-align: right; margin-top: 20px;">
                <a th:href="@{/employee-advances}" class="btn-secondary-custom" style="margin-right: 8px;">Cancel</a>
                <button type="submit" class="btn-success-custom">
                    <i class="fas fa-check"></i> Record Advance
                </button>
            </div>

        </form>
    </div>

</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
