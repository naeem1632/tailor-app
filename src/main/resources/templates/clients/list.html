<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Clients')}"></head>
<body>

<!-- Include Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid" style="padding-top: 20px;">

<!-- Page Header -->
<div class="page-header-standard">
    <h1><i class="fas fa-users"></i> All Clients</h1>
    <div class="header-actions">
        <button class="btn-success-custom" onclick="openModal()">
            <i class="fas fa-user-plus"></i> Add Client
        </button>
    </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar-3">

    <div class="toolbar-center">
        <form th:action="@{/clients}" method="get" class="search-form">
            <input type="text" name="q" th:value="${q}" placeholder="Search by ID, name or mobile...">
            <button type="submit">🔍 Search</button>
            <a th:href="@{/clients}">Reset</a>
        </form>
    </div>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Mobile</th>
        <th>WhatsApp</th>
        <th>Address</th>
        <th>Picture</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${clients}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.mobile}"></td>
        <td th:text="${c.whatsAppNo}"></td>
        <td th:text="${c.address}"></td>
        <td><img th:if="${c.pictureFilename}" th:src="@{${c.pictureFilename}}" alt="pic"/></td>
        <td>
            <a href="javascript:void(0)"
               class="btn-action-edit"
               th:attr="data-id=${c.id},
                  data-name=${c.name},
                  data-mobile=${c.mobile},
                  data-whatsapp=${c.whatsAppNo},
                  data-address=${c.address}"
               onclick="openModalFromRow(this)"><i class="fas fa-edit"></i> Edit</a>
            <a th:href="@{'/clients/details/' + ${c.id}}" class="btn-action-view"><i class="fas fa-eye"></i> View</a>
            <a th:href="@{'/payments/client/' + ${c.id}}" class="btn-action-secondary" target="_blank"><i class="fas fa-money-bill-wave"></i> Payments</a>
            <a th:href="@{'/clients/view/' + ${c.id}}" class="btn-action-view" target="_blank"><i class="fas fa-ruler"></i> Measure</a>
        </td>
    </tr>
    </tbody>
</table>

<!-- ✅ MODAL (Styled Same as Payments) -->
<div id="clientModal" class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()" aria-label="Close modal">&times;</span>
        <h3 id="modalTitle">Add Client</h3>

        <form class="client-form" th:action="@{/clients/save}" method="post" enctype="multipart/form-data" onsubmit="showLoading('Saving client...')">
            <input type="hidden" name="id" id="clientId"/>
            <input type="hidden" name="imageData" id="imageData"/>

            <table>
                <tr>
                    <th>Name</th>
                    <td><input type="text" name="name" id="name"
                               required
                               minlength="2"
                               maxlength="100"
                               pattern="^(?!\s*$).+"
                               title="Name must be 2-100 characters and cannot be only whitespace"></td>
                    <th>Mobile #</th>
                    <td><input type="tel" name="mobile" id="mobile"
                               required
                               pattern="[0-9+\-\s()]+"
                               minlength="10"
                               maxlength="20"
                               title="Mobile number must be 10-20 characters and contain only numbers, +, -, spaces, or parentheses"></td>
                </tr>
                <tr>
                    <th>WhatsApp #</th>
                    <td>
                        <input type="tel" name="whatsAppNo" id="whatsAppNo"
                               pattern="[0-9+\-\s()]*"
                               maxlength="20"
                               title="WhatsApp number must contain only numbers, +, -, spaces, or parentheses">
                        <button type="button" id="sameAsMobileBtn" style="margin-left: 8px; padding: 4px 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">
                            Same as Mobile
                        </button>
                    </td>
                    <th>Address</th>
                    <td><input type="text" name="address" id="address"
                               required
                               minlength="5"
                               maxlength="200"
                               title="Address must be 5-200 characters"></td>
                </tr>
                <tr>
                    <th>Picture</th>
                    <td colspan="3">
                        <input type="file" name="pictureFile" accept="image/*">
                        <button type="button" id="startCamBtn" style="margin-top:8px;">📷 Use Camera</button>
                        <div id="cameraContainer">
                            <video id="video" autoplay></video><br>
                            <button type="button" id="captureBtn">Capture</button>
                            <canvas id="canvas" style="display:none;"></canvas>
                        </div>
                    </td>
                </tr>
            </table>

            <div class="actions">
                <button type="submit">Save</button>
                <a href="javascript:void(0)" onclick="closeModal()">Cancel</a>
            </div>
        </form>
    </div>
</div>

<!-- ✅ Warning Modal for Same as Mobile -->
<div id="warningModal" class="modal-overlay" role="alertdialog" aria-labelledby="warningTitle" aria-modal="true">
    <div class="modal-box">
        <h3 id="warningTitle">⚠ Warning</h3>
        <p>Please enter a mobile number first</p>
        <div class="modal-actions">
            <button id="closeWarningBtn" class="btn-secondary-custom" aria-label="Close warning">OK</button>
        </div>
    </div>
</div>

<!-- ✅ Camera Error Modal -->
<div id="cameraErrorModal" class="modal-overlay" role="alertdialog" aria-labelledby="cameraErrorTitle" aria-modal="true">
    <div class="modal-box">
        <h3 id="cameraErrorTitle">⚠ Camera Error</h3>
        <p id="cameraErrorMessage">Unable to access camera</p>
        <div class="modal-actions">
            <button id="closeCameraErrorBtn" class="btn-secondary-custom" aria-label="Close error">OK</button>
        </div>
    </div>
</div>

<script>
    const modal = document.getElementById("clientModal");
    const title = document.getElementById("modalTitle");

    function openModalFromRow(el) {
      openModal(el.dataset.id, el.dataset.name, el.dataset.mobile, el.dataset.whatsapp, el.dataset.address);
    }

    function openModal(id, name, mobile, whatsapp, address) {
      modal.classList.add("show");
      document.body.style.overflow = "hidden";
      title.innerText = id ? "Edit Client" : "Add Client";

      document.getElementById("clientId").value = id || "";
      document.getElementById("name").value = name || "";
      document.getElementById("mobile").value = mobile || "";
      document.getElementById("whatsAppNo").value = whatsapp || "";
      document.getElementById("address").value = address || "";
    }

    function closeModal() {
      modal.classList.remove("show");
      document.body.style.overflow = "auto";
    }

    // === Camera Logic ===
    const startCamBtn = document.getElementById('startCamBtn');
    const cameraContainer = document.getElementById('cameraContainer');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const imageData = document.getElementById('imageData');
    const captureBtn = document.getElementById('captureBtn');
    let stream = null;

    // Passport size dimensions (3:4 ratio) - 600x800 pixels
    const PASSPORT_WIDTH = 600;
    const PASSPORT_HEIGHT = 800;

    startCamBtn.addEventListener('click', async () => {
      cameraContainer.style.display = 'block';
      if (!stream) {
        try {
          // Use front camera (facingMode: "user")
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user",
              width: { ideal: PASSPORT_WIDTH },
              height: { ideal: PASSPORT_HEIGHT }
            }
          });
          video.srcObject = stream;
        } catch (err) {
          // Show custom camera error modal instead of alert
          document.getElementById('cameraErrorMessage').textContent = 'Error accessing camera: ' + err.message;
          document.getElementById('cameraErrorModal').style.display = 'flex';
        }
      }
    });

    captureBtn.addEventListener('click', () => {
      // Set canvas to passport size
      canvas.width = PASSPORT_WIDTH;
      canvas.height = PASSPORT_HEIGHT;

      const context = canvas.getContext('2d');
      canvas.style.display = 'block';

      // Calculate dimensions to fit video into passport size (crop to center)
      const videoAspect = video.videoWidth / video.videoHeight;
      const passportAspect = PASSPORT_WIDTH / PASSPORT_HEIGHT;

      let sx, sy, sWidth, sHeight;

      if (videoAspect > passportAspect) {
        // Video is wider - crop sides
        sHeight = video.videoHeight;
        sWidth = video.videoHeight * passportAspect;
        sx = (video.videoWidth - sWidth) / 2;
        sy = 0;
      } else {
        // Video is taller - crop top/bottom
        sWidth = video.videoWidth;
        sHeight = video.videoWidth / passportAspect;
        sx = 0;
        sy = (video.videoHeight - sHeight) / 2;
      }

      // Draw cropped and resized image
      context.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, PASSPORT_WIDTH, PASSPORT_HEIGHT);

      // Convert to data URL with compression
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      imageData.value = dataUrl;

      // Stop camera after capture
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.style.display = 'none';
    });

    // Auto-open Add Client modal if redirected from dashboard
    window.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('add') === 'true') {
            openModal();
            // Remove the parameter from URL without reloading
            const url = new URL(window.location);
            url.searchParams.delete('add');
            window.history.replaceState({}, '', url);
        }
    });

    // === Same as Mobile Button Logic ===
    const sameAsMobileBtn = document.getElementById('sameAsMobileBtn');
    const mobileInput = document.getElementById('mobile');
    const whatsAppInput = document.getElementById('whatsAppNo');
    const warningModal = document.getElementById('warningModal');
    const closeWarningBtn = document.getElementById('closeWarningBtn');

    sameAsMobileBtn.addEventListener('click', function() {
        const mobileValue = mobileInput.value.trim();
        if (mobileValue) {
            whatsAppInput.value = mobileValue;
            // Optional: Add visual feedback
            sameAsMobileBtn.textContent = '✓ Copied';
            setTimeout(() => {
                sameAsMobileBtn.textContent = 'Same as Mobile';
            }, 1500);
        } else {
            // Show custom warning modal instead of alert
            warningModal.style.display = 'flex';
        }
    });

    // Close warning modal when OK is clicked
    closeWarningBtn.addEventListener('click', function() {
        warningModal.style.display = 'none';
    });

    // Close warning modal when clicking outside the box
    warningModal.addEventListener('click', function(e) {
        if (e.target === warningModal) {
            warningModal.style.display = 'none';
        }
    });

    // === Camera Error Modal Logic ===
    const cameraErrorModal = document.getElementById('cameraErrorModal');
    const closeCameraErrorBtn = document.getElementById('closeCameraErrorBtn');

    // Close camera error modal when OK is clicked
    closeCameraErrorBtn.addEventListener('click', function() {
        cameraErrorModal.style.display = 'none';
    });

    // Close camera error modal when clicking outside the box
    cameraErrorModal.addEventListener('click', function(e) {
        if (e.target === cameraErrorModal) {
            cameraErrorModal.style.display = 'none';
        }
    });

    // === Keyboard Navigation (ESC to close modals) ===
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' || e.keyCode === 27) {
            // Close any open modals
            if (modal.classList.contains('show')) {
                closeModal();
            }
            if (warningModal.style.display === 'flex') {
                warningModal.style.display = 'none';
            }
            if (cameraErrorModal.style.display === 'flex') {
                cameraErrorModal.style.display = 'none';
            }
        }
    });
</script>

</div><!-- Close container-fluid -->

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
