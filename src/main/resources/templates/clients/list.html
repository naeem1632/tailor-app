<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Clients - Stitch & Style</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/fontawesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/fonts.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        /* Different colors for action buttons */
        .btn-edit {
            background-color: #007bff !important;
            color: white !important;
        }
        .btn-view-client {
            background-color: #17a2b8 !important;
            color: white !important;
        }
        .btn-measure {
            background-color: #28a745 !important;
            color: white !important;
        }
        .btn-payment {
            background-color: #ff8c00 !important;
            color: white !important;
        }
    </style>
</head>
<body>

<!-- Include Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid" style="padding-top: 20px;">

<h1>All Clients</h1>

<!-- TOOLBAR -->
<div class="toolbar-3">
    <div class="toolbar-left">
        <button class="add-btn" onclick="openModal()">Add Client</button>
    </div>

    <div class="toolbar-center">
        <form th:action="@{/clients}" method="get" class="search-form">
            <input type="text" name="q" th:value="${q}" placeholder="Search by name or mobile...">
            <button type="submit">🔍 Search</button>
            <a th:href="@{/clients}">Reset</a>
        </form>
    </div>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Mobile</th>
        <th>WhatsApp</th>
        <th>Address</th>
        <th>Picture</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${clients}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.mobile}"></td>
        <td th:text="${c.whatsAppNo}"></td>
        <td th:text="${c.address}"></td>
        <td><img th:if="${c.pictureFilename}" th:src="@{${c.pictureFilename}}" alt="pic"/></td>
        <td>
            <a href="javascript:void(0)"
               class="btn-action btn-edit"
               th:attr="data-id=${c.id},
                  data-name=${c.name},
                  data-mobile=${c.mobile},
                  data-whatsapp=${c.whatsAppNo},
                  data-address=${c.address}"
               onclick="openModalFromRow(this)">Edit</a>
            <a th:href="@{'/clients/details/' + ${c.id}}" class="btn-action btn-view-client">View Client</a>
            <a th:href="@{'/payments/client/' + ${c.id}}" class="btn-action btn-payment">Payments</a>
            <a th:href="@{'/clients/view/' + ${c.id}}" class="btn-action btn-measure">Measurements</a>
        </td>
    </tr>
    </tbody>
</table>

<!-- ✅ MODAL (Styled Same as Payments) -->
<div id="clientModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">Add Client</h3>

        <form class="client-form" th:action="@{/clients/save}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="id" id="clientId"/>
            <input type="hidden" name="imageData" id="imageData"/>

            <table>
                <tr>
                    <th>Name</th><td><input type="text" name="name" id="name" required></td>
                    <th>Mobile #</th><td><input type="text" name="mobile" id="mobile" required></td>
                </tr>
                <tr>
                    <th>WhatsApp #</th><td><input type="text" name="whatsAppNo" id="whatsAppNo"></td>
                    <th>Address</th><td><input type="text" name="address" id="address" required></td>
                </tr>
                <tr>
                    <th>Picture</th>
                    <td colspan="3">
                        <input type="file" name="pictureFile" accept="image/*">
                        <button type="button" id="startCamBtn" style="margin-top:8px;">📷 Use Camera</button>
                        <div id="cameraContainer">
                            <video id="video" autoplay></video><br>
                            <button type="button" id="captureBtn">Capture</button>
                            <canvas id="canvas" style="display:none;"></canvas>
                        </div>
                    </td>
                </tr>
            </table>

            <div class="actions">
                <button type="submit">Save</button>
                <a href="javascript:void(0)" onclick="closeModal()">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
    const modal = document.getElementById("clientModal");
    const title = document.getElementById("modalTitle");

    function openModalFromRow(el) {
      openModal(el.dataset.id, el.dataset.name, el.dataset.mobile, el.dataset.whatsapp, el.dataset.address);
    }

    function openModal(id, name, mobile, whatsapp, address) {
      modal.classList.add("show");
      document.body.style.overflow = "hidden";
      title.innerText = id ? "Edit Client" : "Add Client";

      document.getElementById("clientId").value = id || "";
      document.getElementById("name").value = name || "";
      document.getElementById("mobile").value = mobile || "";
      document.getElementById("whatsAppNo").value = whatsapp || "";
      document.getElementById("address").value = address || "";
    }

    function closeModal() {
      modal.classList.remove("show");
      document.body.style.overflow = "auto";
    }

    // === Camera Logic ===
    const startCamBtn = document.getElementById('startCamBtn');
    const cameraContainer = document.getElementById('cameraContainer');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const imageData = document.getElementById('imageData');
    const captureBtn = document.getElementById('captureBtn');
    let stream = null;

    // Passport size dimensions (3:4 ratio) - 600x800 pixels
    const PASSPORT_WIDTH = 600;
    const PASSPORT_HEIGHT = 800;

    startCamBtn.addEventListener('click', async () => {
      cameraContainer.style.display = 'block';
      if (!stream) {
        try {
          // Use front camera (facingMode: "user")
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user",
              width: { ideal: PASSPORT_WIDTH },
              height: { ideal: PASSPORT_HEIGHT }
            }
          });
          video.srcObject = stream;
        } catch (err) {
          alert('Error accessing camera: ' + err.message);
        }
      }
    });

    captureBtn.addEventListener('click', () => {
      // Set canvas to passport size
      canvas.width = PASSPORT_WIDTH;
      canvas.height = PASSPORT_HEIGHT;

      const context = canvas.getContext('2d');
      canvas.style.display = 'block';

      // Calculate dimensions to fit video into passport size (crop to center)
      const videoAspect = video.videoWidth / video.videoHeight;
      const passportAspect = PASSPORT_WIDTH / PASSPORT_HEIGHT;

      let sx, sy, sWidth, sHeight;

      if (videoAspect > passportAspect) {
        // Video is wider - crop sides
        sHeight = video.videoHeight;
        sWidth = video.videoHeight * passportAspect;
        sx = (video.videoWidth - sWidth) / 2;
        sy = 0;
      } else {
        // Video is taller - crop top/bottom
        sWidth = video.videoWidth;
        sHeight = video.videoWidth / passportAspect;
        sx = 0;
        sy = (video.videoHeight - sHeight) / 2;
      }

      // Draw cropped and resized image
      context.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, PASSPORT_WIDTH, PASSPORT_HEIGHT);

      // Convert to data URL with compression
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      imageData.value = dataUrl;

      // Stop camera after capture
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.style.display = 'none';
    });

    // Auto-open Add Client modal if redirected from dashboard
    window.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('add') === 'true') {
            openModal();
            // Remove the parameter from URL without reloading
            const url = new URL(window.location);
            url.searchParams.delete('add');
            window.history.replaceState({}, '', url);
        }
    });
</script>

</div><!-- Close container-fluid -->

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
